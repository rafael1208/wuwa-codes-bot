name: Códigos WuWa no Discord

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: wuwa-codes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar códigos e enviar ao Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: python wuwa_codes.py

      - name: Salvar lista de códigos já enviados
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent_codes.json)" ]; then
            git config user.name "wuwa-codes-bot"
            git config user.email "wuwa-codes-bot@users.noreply.github.com"
            git add sent_codes.json
            git commit -m "Códigos enviados: atualização"
            git push
          fi
